// ────────────────────────────────────────── the desktop camera ──────────────────────────────────────────
// Every move has a reason and a landing; the holds are keyed flat so they are dead still. Longer moves for longer

function buildCamera() {
  const ed = { x: 960, y: G.film[0].y - G.sEd + G.film[0].h / 2, zoom: 1.36, rot: 0 };
  const h = G.handle, cta = { x: h.x + 120, y: h.y - G.sEd - 14, zoom: 2.2 };
  const fm = { x: G.fmark.x + G.fmark.w / 2, y: G.fmark.y - G.sMax + G.fmark.h / 2, zoom: 704 / G.fmark.w };  // the closing frame = the opening frame

  const barY = G.P.y + (G.mbar.y + G.mbar.h / 2) * G.P.s;            // … and centred where the phone's bar will be
  const bar = { x: 960 - (G.P.x + (G.mbar.x + G.mbar.w / 2) * G.P.s - 960) / barMatch, y: G.bar.y + G.bar.h / 2 + (540 - barY) / barMatch, zoom: barMatch };

    { t: 0, x: 960, y: 540, zoom: 1.6 },
    { t: h1, x: 960, y: 540, zoom: 1.6 },
    { t: h1 + 1.1, x: 960, y: 540, zoom: 1.0, curve: SITE.inout },                     // rides the site's own hand-off curve
    { t: T.ptr[0] + 0.2, x: 960, y: 540, zoom: 1.0 },
    { t: 7.6, x: 850, y: 600, zoom: 1.14, curve: ease.sineInOut },                     // a slow push that trails the light
    { t: T.toNav[0], x: 850, y: 600, zoom: 1.14 },
    { t: T.toNav[1], x: 960, y: 225, zoom: 2.4, curve: ease.cubicInOut },              // to the nav: decisive, not a snap
    { t: T.morph, x: 960, y: 225, zoom: 2.4 },
    { t: T.cam2, ...bar, curve: ease.cubicInOut },                                      // pull back until the bar is the phone's bar
    { t: T.cam2 + 0.3, ...bar },

    { t: T.glide[0], ...ed },

}

function scrollD(t) {

}
const scrollM = t => Math.round(G.sM * tw(t, T.mscroll[0], T.mscroll[1] - T.mscroll[0], ease.cubicInOut) * 4) / 4;
// the site's intro clock, held on the lit name before the hand-off

// ────────────────────────────────────────── the phone ──────────────────────────────────────────
function mobileAt(t) {

// ────────────────────────────────────────── the films ──────────────────────────────────────────
const pad = n => String(n).padStart(4, '0');

  const A = want(prev), B = want(cur), k = tw(t, tc, 0.16, SITE.out);

  }

// the GLASS light passing across a film frame

// ────────────────────────────────────────── colours ──────────────────────────────────────────

// 07 · the reflection reveals BRETÌA: what the light has passed is drawn, a soft band of light rides its edge
function drawLogo(u) {                        // u: the light's front across the artwork, 0 → 1 (≥ 1: fully revealed)
  const key = Math.round(clamp(u, -0.01, 1.01) * 600);

// ────────────────────────────────────────── seek ──────────────────────────────────────────

  const phOp = tw(t, T.unroll[0] + 0.3, 0.5, SITE.out) * (1 - tw(t, T.push[0], 0.6, SITE.out)) * (MOB.vis ? 1 : 0);
  const ph = $('phone'), bz = 11;
  Object.assign(ph.style, { opacity: phOp.toFixed(4), left: (MOB.x - bz).toFixed(2) + 'px', top: (MOB.y - bz).toFixed(2) + 'px',
    width: (390 * MOB.s + 2 * bz).toFixed(2) + 'px', height: (844 * MOB.s + 2 * bz).toFixed(2) + 'px', borderRadius: (44 * MOB.s + bz).toFixed(2) + 'px' });
  // 03 · the menu morphs out of the toggle: the surface forms first (280 ms, the site's ease-out), then its links
  // (+45 ms each). It leaves faster (160 ms) — the system answering, not presenting. UI timing, under 300 ms.
  const tO = T.menuOpen, tC = T.menuClose, open = t >= tO && t < tC;
  const km1 = t < tO ? 0 : t < tC ? tw(t, tO, 0.28, SITE.out) : 1 - tw(t, tC, 0.16, SITE.out);
  const mr = G.menu, from = { x: mr.w - 104, y: 0, w: 104, h: 44, r: 10 }, to = { x: 0, y: 0, w: mr.w, h: mr.h, r: 10 };
  const mc = OM.morphRect(km1, 0, 1, from, to, { curve: u => u });
  Object.assign(ME.menu.style, { opacity: clamp(km1 * 2.2, 0, 1).toFixed(4), visibility: km1 > 0 ? 'visible' : 'hidden', transform: 'none', clipPath: km1 < 1 ? inset(mc, mr.w, mr.h) : '' });
  M.host.classList.toggle('menu-open', open);

  [...ME.links, ME.foot].forEach((l, i) => {
    const v = t < tO ? 0 : t < tC ? tw(t, tO + 0.08 + 0.045 * i, 0.22, SITE.out) : 1 - tw(t, tC, 0.12, SITE.out);
    l.style.opacity = v.toFixed(4); l.style.transform = `translateY(${(6 * (1 - v)).toFixed(3)}px)`;
    if (i === 0) l.style.color = t >= T.tapAtm && t < tC ? 'var(--c-silver)' : '';
  });
  Object.assign(ME.scrim.style, { opacity: km1.toFixed(4), visibility: km1 > 0 ? 'visible' : 'hidden' });
  const exT = t < tC ? tO : tC;
  const kCol = t < tO ? 0 : open ? tw(t, exT, 0.16, SITE.ease) : 1 - tw(t, exT, 0.16, SITE.ease);
  const kRot = t < tO ? 0 : open ? tw(t, exT, 0.22, SITE.inout) : 1 - tw(t, exT, 0.22, SITE.inout);
  ME.toggle.setAttribute('aria-expanded', String(open));
  ME.toggle.style.color = mix(SILVER, WHITE, kCol);
  ME.lines[0].style.transform = `translateY(${(2.5 * kRot).toFixed(3)}px) rotate(${(45 * kRot).toFixed(3)}deg)`;
  ME.lines[1].style.transform = `translateY(${(-2.5 * kRot).toFixed(3)}px) rotate(${(-45 * kRot).toFixed(3)}deg)`;
  const pr = t >= T.tapMenu && t < tO ? tw(t, T.tapMenu, 0.14, SITE.out) : t >= tO ? tw(tO, T.tapMenu, 0.14, SITE.out) * (1 - tw(t, tO, 0.14, SITE.out)) : 0;
  ME.toggle.style.transform = `scale(${(1 - 0.03 * pr).toFixed(5)})`;
  // the mobile film: autoplays once it is on screen after the scroll (films.ts); 04 · the light sweeps it open
  const [m1, m2] = ME.films;
  setImg(m1, t < T.play01 ? 'site/media/glass-experience-01-poster.webp' : F01(src01(t)), pending);
  m1.ctrl.style.opacity = (filmUI(m1, [[-1, 'idle'], [T.play01, 'playing']], t) * (1 - tw(t, T.push[0], 0.35, SITE.out))).toFixed(3);
  sheen(m1, t, T.sheen[0], T.sheen[1]);
  setImg(m2, STILL02, pending);

  // ── the hand: a pointer on the desktop, a touch on the phone
  const P = pointerAt(t), pe = $('pointer');
  if (P) {
    const [sx, sy] = OM.project(MD, P.p[0], P.p[1]), sc = (0.92 + 0.32 * Math.log2(CAM.zoom)) * OM.cursor(t, [{ t: 0, x: 0, y: 0 }], CLICKS).s;
    pe.style.opacity = P.op.toFixed(3); pe.style.transform = `translate(${(sx - 2).toFixed(2)}px, ${(sy - 1).toFixed(2)}px) scale(${sc.toFixed(4)})`;
  } else pe.style.opacity = 0;
  const tt = $('touch'), touch = [[T.tapMenu, ctr(G.toggle)], [T.tapAtm, ctr(G.mlinks[0])]].find(([t0]) => t >= t0 - 0.12 && t < t0 + 0.45);
  if (touch) {
    const [t0, p] = touch, lx = MOB.x + p.x * MOB.s, ly = MOB.y + p.y * MOB.s;      // the toggle and the menu are fixed: no scroll
    const kin = tw(t, t0 - 0.12, 0.12, SITE.out), kout = tw(t, t0 + 0.1, 0.35, SITE.out);
    tt.style.opacity = (kin * (1 - kout)).toFixed(3); tt.style.transform = `translate(${lx.toFixed(2)}px, ${ly.toFixed(2)}px) scale(${(0.72 + 0.28 * kin + 0.3 * kout).toFixed(4)})`;
  } else tt.style.opacity = 0;

  // ── the bookend light, the recede, the signature
  const kg = tw(t, T.glow, 1.5, SITE.quart), kgo = tw(t, T.recede, 0.9, SITE.out);
  $('glow').style.opacity = (kg * (1 - kgo)).toFixed(4);
  $('glow').style.transform = `translate(-50%, -50%) translateX(${(-12 * (1 - kg)).toFixed(3)}%) scale(${(0.94 + 0.06 * kg).toFixed(5)})`;
  $('dither').style.opacity = t >= T.fade[0] ? 1 : 0;
  const pw = OM.wordRise(t, T.powered, { zeta: 0.9, omega: 12, dist: 12, s0: 0.985, ds: 0.015, fade: 1.2 });
  $('powered').style.opacity = pw.op.toFixed(4); $('powered').style.transform = `translateY(${pw.y.toFixed(2)}px)`;
  // 07 · a slight rise and a restrained scale, one small settle (ζ .9): presence, not a bounce
  let kl = OM.swiftSpring(t - T.reveal[0], 'smooth', { duration: 1.25, bounce: 0.1 }); if (Math.abs(1 - kl) < 0.0015 && t > T.reveal[1]) kl = 1;
  const uRev = seg(t, T.reveal[0], T.reveal[1]), lop = t >= T.reveal[0] ? 1 : 0;
  const ltr = `translateY(${(12 * (1 - kl)).toFixed(2)}px) scale(${(0.97 + 0.03 * kl).toFixed(5)})`;
  $('logo').style.opacity = lop; $('logo').style.transform = ltr;
  $('placeholder').style.opacity = clamp(uRev * 2, 0, 1).toFixed(3); $('placeholder').style.transform = ltr;
  drawLogo(t < T.reveal[0] ? 0 : t >= T.reveal[1] ? 1 : ease.sineInOut(uRev));

  // ── what probe.py and verify read: boxes on screen
  const box = (el, op) => { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, op }; };
  const phoneBox = { x: MOB.x + c.x * MOB.s, y: MOB.y + c.y * MOB.s, w: c.w * MOB.s, h: c.h * MOB.s, op: MOB.vis ? MOB.op : 0 };
  // the mobile film panel as seen through the phone's screen (part of it may still be below the fold)
  const mf = G.mfilm[0], pb = { x: MOB.x + mf.x * MOB.s, y: MOB.y + (mf.y - sM) * MOB.s, w: mf.w * MOB.s, h: mf.h * MOB.s };
  const y0 = Math.max(pb.y, phoneBox.y), y1 = Math.min(pb.y + pb.h, phoneBox.y + phoneBox.h);
  const inPhone = y1 - y0 > 0.3 * pb.h ? { x: pb.x, y: y0, w: pb.w, h: y1 - y0, op: phoneBox.op } : { ...pb, op: 0 };
  const swapMid = (T.swap[0] + T.swap[1]) / 2, deskOp = deskVis ? 1 : 0;
  TRACK = {
    // the wordmark: the intro's mark, which becomes the hero's ghost wordmark
    mark: intro ? box(DE.imark, +DE.imark.style.opacity) : box(DE.heroMark, deskVis && t < 12 ? 0.075 * (1 - kRoom) : 0),
    headline: box(DE.title, deskVis && t < 12 ? (t >= T.words ? 1 : 0) * (1 - kRoom) : 0),
    // the glass bar: the desktop nav, which becomes the phone's bar, which grows into the phone
    glass: t < swapMid ? box(DE.bar, deskVis ? navOp : 0) : (t < T.push[0] ? phoneBox : { ...phoneBox, op: 0 }),
    menu: box(ME.menu, MOB.vis ? clamp(km1 * 2.2, 0, 1) * MOB.op : 0),
    film01: t < T.push[0] ? inPhone : (t < T.back[1] ? phoneBox : box(d1.frame, deskOp * (1 - kFoot))),
    heading: box(DE.xpTitle, t >= T.iris[0] ? deskOp * (1 - kFoot) : 0),
    film02: box(d2.frame, t >= T.iris[0] ? deskOp * (1 - kFoot) : 0),
    cta: box(DE.handle, t >= T.iris[0] ? 1 - kFoot : 0),
    fmark: box(DE.fmark, t >= T.iris[0] ? 1 - kRec : 0),
    powered: box($('powered'), pw.op),
    bretia: { ...LOGO_BOX, op: lop * clamp(uRev * 1.5, 0, 1) },
  };
  if (P) TRACK.pointer = { x: OM.project(MD, P.p[0], P.p[1])[0], y: OM.project(MD, P.p[0], P.p[1])[1], w: 18, h: 26, op: P.op };
  $('hud').textContent = 't=' + t.toFixed(3);
  return Promise.all(pending);
}

// ────────────────────────────────────────── contract ──────────────────────────────────────────
window.__seek = async t => { await seek(t); return true; };
window.__track = t => { seek(t); const o = {}; for (const [k, b] of Object.entries(TRACK)) if (b && b.op > 0.02) o[k] = b; return o; };
// farthest on-screen travel between two times: tracked boxes (clipped to the frame), the desktop camera and scroll,
// the page inside the phone — which moves under its own transform and scroll while its clip window may not — and the
// sweeps of light (the name's band, the film sheen, the aperture's edge, the reveal's front)
window.__motion = (t0, t1) => {
  const corners = b => [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]].map(([x, y]) => [clamp(x, -60, 1980), clamp(y, -60, 1140)]);
  seek(t0); const A = JSON.parse(JSON.stringify(TRACK)), c0 = CAM, m0 = MOB, s0 = scrollM(t0), d0 = scrollD(t0);
  seek(t1); const B = TRACK, c1 = CAM, m1 = MOB, s1 = scrollM(t1), d1 = scrollD(t1);
  let far = 0;
  for (const k of Object.keys(B)) {
    if (!A[k] || Math.max(A[k].op, B[k].op) < 0.03) continue;
    const a = corners(A[k]), b = corners(B[k]);
    for (let i = 0; i < 4; i++) far = Math.max(far, Math.hypot(a[i][0] - b[i][0], a[i][1] - b[i][1]));
  }
  const vis = tt => tt < T.swap[1] || tt >= T.iris[0];
  if (vis(t0) && vis(t1)) far = Math.max(far, OM.screenTravel(c0, c1, camAt((t0 + t1) / 2)), Math.abs(d1 - d0) * c1.zoom);
  if (m0.vis && m1.vis) {
    const c = m1.clip, P = [[c.x, c.y], [c.x + c.w, c.y], [c.x, c.y + c.h], [c.x + c.w, c.y + c.h], [c.x + c.w / 2, c.y + c.h / 2]];
    for (const [lx, ly] of P) {                 // the same point of the page, seen at t0 and at t1
      const x1 = m1.x + lx * m1.s, y1 = m1.y + ly * m1.s, x0 = m0.x + lx * m0.s, y0 = m0.y + (ly + s1 - s0) * m0.s;
      if (x1 > -60 && x1 < 1980 && y1 > -60 && y1 < 1140) far = Math.max(far, Math.hypot(x1 - x0, y1 - y0));
    }
  }
  const band = (a, b, t, w) => (t >= a && t <= b ? w * Math.abs(seg(t1, a, b) - seg(t0, a, b)) * 1.6 : 0);  // sine-eased sweeps peak at ~1.6× mean
  far = Math.max(far, band(T.sweep[0], T.sweep[1], t1, 704 * 1.28), band(T.sheen[0], T.sheen[1], t1, G.L.w * 2.6), band(T.reveal[0], T.reveal[1], t1, 760 * 1.24));
  return far;
};
// what the sound score reads: every event the picture causes, with its screen x as a pan, and the beat times
window.__events = () => {
  const pan = x => clamp((x - 960) / 960, -1, 1), e = [];
  const at = (t, kind, x = 960, v = 1) => e.push({ t, kind, pan: +pan(x).toFixed(3), v });
  at(T.intro + 0.1, 'light-rise', 900, 0.8);
  at(T.sweep[0], 'sweep', 700, 1);
  at(T.introHold[1], 'handoff', 960, 1);
  at(T.navIn, 'nav-expand', 960, 0.6);
  HOVER.forEach((iv, i) => iv.forEach(([a]) => at(a, 'hover', OM.project(OM.view(camAt(a)), ctr(G.links[i]).x, 0)[0], 0.55)));
  at(T.toNav[0], 'approach', 960, 0.7);
  at(T.morph, 'bar', 960, 0.7);
  at(T.unroll[0], 'unroll', 960, 0.8);
  at(T.tapMenu, 'tap', G.P.x + ctr(G.toggle).x * G.P.s, 0.8);
  at(T.menuOpen, 'menu-open', G.P.x + ctr(G.toggle).x * G.P.s, 0.6);
  at(T.tapAtm, 'tap', G.P.x + ctr(G.mlinks[0]).x * G.P.s, 0.7);
  at(T.mscroll[0], 'scroll', 960, 0.6);
  at(T.push[0], 'portal', 960, 1);
  at(T.sheen[0], 'sheen', 900, 0.8);
  at(T.back[0], 'back', 1100, 0.7);
  at(T.iris[0], 'iris', 1000, 0.8);
  at(T.click02, 'click', 1500, 0.8);
  at(T.glide[0], 'glide', 600, 0.6);
  at(T.ctaPress[0], 'click', 420, 0.6);
  at(T.down[0], 'descend', 960, 0.7);
  at(T.glow, 'bookend', 960, 1);
  at(T.recede, 'recede', 960, 0.8);
  at(T.powered, 'powered', 960, 0.4);
  at(T.reveal[0], 'signature', 960, 1);
  // the light's speed (px/s on screen), for the air that follows it
  const curve = []; for (let t = 0; t <= DUR; t += 1 / 60) { const a = LIGHT(Math.max(0, t - 1 / 60)), b = LIGHT(t); curve.push(+(Math.hypot(b[0] - a[0], b[1] - a[1]) * 60).toFixed(1)); }
  return { T: DUR, beats: T, events: e.sort((p, q) => p.t - q.t), light: { hz: 60, speed: curve } };
};

window.__ready = (async () => {
  await document.fonts.ready;
  await Promise.all([document.fonts.load("300 64px 'Jost'"), document.fonts.load("460 17px 'Jost'")]);
  HAS_LOGO = await logoReady;
  await Promise.all([...D.root.querySelectorAll('img'), ...M.root.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
  measure(); buildHands(); buildCamera(); simulateLight(); findHovers();
  // the desktop panel's rect on screen at the editorial framing: where the phone's film lands
  const Me = OM.view(G.ed), r = G.film[0];
  G.D1 = OM.projectBox(Me, { x: r.x, y: r.y - G.sEd, w: r.w, h: r.h });
  layoutEnd(); dither();
  await seek(0);
  return true;
})();
if (Q.has('hud')) $('hud').style.display = 'block';
if (Q.has('t')) __ready.then(() => seek(parseFloat(Q.get('t'))));
if (Q.has('play')) __ready.then(() => { const t0 = performance.now(); (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); });
