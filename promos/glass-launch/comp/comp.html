<script>
// ══════════════════════════════════════════════════════════════════════════════════════════════
// RIFLESSO — a single reflection travels through GLASS; the name is the architecture it moves through.
// The website is the material: its own markup and CSS are mounted live (desktop 1920×1080 and the real 390-px
// mobile layout), and every state the film shows is one the site has, written from the site's own durations and
// curves (src/scripts/intro.ts, light.ts, menu.ts, films.ts; the CSS transitions). Everything is f(t).
//
//  t (s)          beat                            what carries into the next beat
//  0.00–0.50      black
//  0.50–2.95      IL NOME: the site's intro       the wordmark (1.6× macro, still)
//  2.95–4.34      the hand-off → hero, page in    the wordmark grows into architecture; camera 1.6 → 1
//  4.50–7.90      LA LUCE HA UNA MANO             the pointer; the light trails it on the site's spring
//  7.90–9.30      hold on the headline            —
//  9.30–10.10     snap to the nav                 the pointer
// 10.10–11.40     three hovers (the burst)        the bar
// 11.45–12.25     the bar becomes the mobile bar  the bar (the responsive layout)
// 12.25–13.00     the phone grows out of the bar  the phone
// 13.00–15.42     MENU tap, Atmosfera, scroll     the tap; the film panel
// 15.75–18.85     into film 01, hold              the panel is the frame
// 18.85–19.75     the panel takes its desktop slot  the panel
// 19.75–22.45     the click on 02, both films     the pointer
// 22.45–23.40     Instagram                        the pointer
// 23.50–25.30     the page ends on its own mark   the mark
// 25.30–27.60     GLASS, the light behind it      —
// 27.60–28.45     recede                          (the end card: the one declared cut)
// 28.45–31.50     POWERED BY BRETÌA, hold
// ══════════════════════════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const { clamp, lerp, seg, ease } = OM;
const FPS = 30, DUR = 31.5;
const Q = new URLSearchParams(location.search);
// the site's own curves (src/styles/global.css, src/scripts/intro.ts) and the CSS keyword `ease`
const SITE = { out: OM.bezier(0.23, 1, 0.32, 1), quart: OM.bezier(0.25, 1, 0.5, 1), inout: OM.bezier(0.77, 0, 0.175, 1), ease: OM.bezier(0.25, 0.1, 0.25, 1) };
const tw = (t, t0, dur, curve) => curve(clamp((t - t0) / dur, 0, 1));

// ────────────────────────────────────────── timeline ──────────────────────────────────────────
const T = {
  intro: 0.5,                                   // the site's intro starts (its own t = 0); it ends 3.84 s later
  ptr: [4.5, 11.5], ptrStop: 7.05, snap: [9.3, 10.1],
  morph: 11.45, swap: [12.0, 12.25], unroll: [12.25, 13.0],
  tapMenu: 13.68, menuOpen: 13.76, tapAtm: 14.62, menuClose: 14.70, mscroll: [14.72, 15.42],
  play01: 15.45, push: [15.75, 16.55], back: [18.85, 19.75], deskIn: [19.15, 19.75],
  ptr2: [19.5, 23.6], click02: 20.15, glide: [21.45, 22.55], ctaHover: 22.5, ctaPress: [23.0, 23.09], ctaLeave: 23.4,
  down: [23.5, 25.3], fade: [24.2, 25.0], glow: 25.3, recede: 27.6, powered: 28.45, logo: 28.85, sweep: [29.95, 30.85],
};
window.__meta = { dur: DUR, fps: FPS, w: 1920, h: 1080, cuts: [3.6, 28.1],   // 3.6: the site's hand-off lands the mark at 7.5 % opacity, under probe's 0.15 floor; 28.1: the end card
 
  inFrame: { pointer: [10.1, 11.2], glass: [13.0, 15.7, 'whole'], film01: [16.6, 18.8, 'whole'], fmark: [25.3, 27.6, 'whole'], bretia: [29.6, 31.5, 'whole'] } };

// ────────────────────────────────────────── the site, mounted ──────────────────────────────────────────
function mount(id, spec) {
  const host = $(id), root = host.attachShadow({ mode: 'open' });
  root.innerHTML = `<style>${spec.css}</style><div class="site-body">${spec.html}</div>`;
  const body = root.querySelector('.site-body');
  Object.assign(body.style, { height: '100%', overflowY: 'auto', overflowX: 'hidden', scrollbarWidth: 'none' });
  root.querySelectorAll('[data-film-control]').forEach(c => c.removeAttribute('hidden'));
  return { host, root, body, q: s => root.querySelector(s), qa: s => [...root.querySelectorAll(s)] };
}
const D = mount('desk', GLASS_SITE.desktop), M = mount('mob', GLASS_SITE.mobile);
D.host.classList.add('light-live');             // a fine pointer: the light follows it (light.ts)
const film = root => ({ root, frame: root.querySelector('.film__frame'), img: root.querySelector('[data-film-poster]'), ctrl: root.querySelector('[data-film-control]'),
  icons: { play: root.querySelector('.film__icon--play'), pause: root.querySelector('.film__icon--pause'), replay: root.querySelector('.film__icon--replay') }, cur: '' });
const DE = {
  veil: D.q('[data-intro-veil]'), iglow: D.q('[data-intro-glow]'), imark: D.q('[data-intro-mark]'), letters: D.qa('[data-intro-mark] .wordmark__letter'),
  heroMark: D.q('[data-hero-mark]'), reveals: D.qa('[data-intro-reveal]').sort((a, b) => a.dataset.introReveal - b.dataset.introReveal),
  light: D.q('[data-light]'), nav: D.q('header.nav'), bar: D.q('.nav__bar'), links: D.qa('.nav__links a'),
  main: D.q('main'), footer: D.q('footer'), fmark: D.q('.footer__mark'), fgrid: D.q('.footer__grid'), flegal: D.q('.footer__legal'),
  films: D.qa('[data-film]').map(film), cta: D.q('.cta'), handle: D.q('.cta__handle'), arrow: D.q('.cta__arrow'),
};
const ME = { bar: M.q('.nav__bar'), toggle: M.q('[data-menu-toggle]'), menu: M.q('[data-menu]'), scrim: M.q('[data-menu-scrim]'),
  links: M.qa('[data-menu-link]'), lines: M.qa('.nav__toggle-icon i'), films: M.qa('[data-film]').map(film) };

// ────────────────────────────────────────── measured in __ready ──────────────────────────────────────────
let G = {};                 // geometry
let KEYS = [];              // desktop camera keys
let MOVES1 = [], MOVES2 = [], LIGHT = null, HOVER = [];
const rectIn = (el, host) => { const r = el.getBoundingClientRect(), h = host.getBoundingClientRect(); return { x: r.left - h.left, y: r.top - h.top, w: r.width, h: r.height }; };
const ctr = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });

function measure() {
  D.host.setAttribute('data-intro', 'play');
  DE.imark.style.transform = 'none';
  const im = rectIn(DE.imark, D.host), hm = rectIn(DE.heroMark, D.host);
  G.handoff = { dx: hm.x + hm.w / 2 - (im.x + im.w / 2), dy: hm.y + hm.h / 2 - (im.y + im.h / 2), s: hm.w / im.w };
  G.introMark = im;
  D.host.removeAttribute('data-intro');
  G.bar = rectIn(DE.bar, D.host);
  G.links = DE.links.map(a => rectIn(a, D.host));
  G.film = DE.films.map(f => rectIn(f.frame, D.host));
  G.ctrl = DE.films.map(f => rectIn(f.ctrl, D.host));
  G.handle = rectIn(DE.handle, D.host);
  G.fmark = rectIn(DE.fmark, D.host);
  G.pageH = D.body.scrollHeight;
  G.sMax = G.pageH - 1080;
  G.sEd = Math.round(G.film[0].y - 140);                         // editorial: the grid's top 140 px under the frame top
  // mobile: the real 390-px layout
  G.mbar = rectIn(ME.bar, M.host);
  G.toggle = rectIn(ME.toggle, M.host);
  ME.links.forEach(l => { l.style.transform = 'none'; }); ME.menu.style.transform = 'none';
  G.mlinks = ME.links.map(l => rectIn(l, M.host));
  ME.links.forEach(l => { l.style.transform = ''; }); ME.menu.style.transform = '';
  const xp = M.q('#atmosfera');
  G.sM = Math.round(xp.offsetTop - 78);                          // anchor scroll lands under scroll-padding-top (10 + 52 + 16)
  G.mfilm = ME.films.map(f => rectIn(f.frame, M.host));          // page coordinates (scroll 0)
  // where things sit on screen
  G.P = { s: 880 / 844 }; G.P.x = 960 - 195 * G.P.s; G.P.y = 100;                 // the phone: 880 px tall, centred
  G.L = { h: 918, w: 918 * 9 / 16 }; G.L.x = 960 - G.L.w / 2; G.L.y = (1080 - G.L.h) / 2;   // film 01 as the frame
}

// ────────────────────────────────────────── the hand ──────────────────────────────────────────
// A pointer path is a list of moves; inside a move the pointer runs a spline through its points on an eased clock,
// between moves it rests. The light, the hovers and the clicks all read the same path, so cause and effect agree.
const move = (t0, t1, pts, curve = ease.sineInOut) => ({ t0, t1, pts, curve, knots: pts.map((p, i) => ({ t: i / Math.max(1, pts.length - 1), x: p[0], y: p[1] })) });
function pathAt(moves, t) {
  let last = moves[0].pts[0];
  for (const m of moves) {
    if (t < m.t0) return last;
    if (t <= m.t1) return OM.spline(m.knots, m.curve(seg(t, m.t0, m.t1)));
    last = m.pts[m.pts.length - 1];
  }
  return last;
}
function buildHands() {
  const L = G.links.map(ctr), c2 = ctr(G.ctrl[1]);
  MOVES1 = [
    move(4.5, T.ptrStop, [[2010, 830], [1560, 600], [1050, 470], [700, 765]]),
    move(9.3, 10.05, [[700, 765], [790, 330], [L[0].x - 6, L[0].y + 3]], ease.cubicInOut),
    move(10.35, 10.55, [[L[0].x - 6, L[0].y + 3], [L[1].x - 4, L[1].y + 2]], ease.cubicInOut),
    move(10.75, 10.95, [[L[1].x - 4, L[1].y + 2], [L[2].x - 10, L[2].y + 3]], ease.cubicInOut),
  ];
  const h = G.handle, hy = h.y - G.sEd + h.h / 2;                                  // the handle, on screen at the editorial scroll
  MOVES2 = [
    move(19.5, 20.08, [[c2.x + 150, c2.y - G.sEd + 330], [c2.x + 40, c2.y - G.sEd + 60], [c2.x + 2, c2.y - G.sEd + 2]], ease.quadOut),
    move(21.55, 22.5, [[c2.x + 2, c2.y - G.sEd + 2], [c2.x - 520, hy + 40], [h.x + h.w * 0.62, hy + 6]], ease.sineInOut),
    move(23.4, 23.62, [[h.x + h.w * 0.62, hy + 6], [h.x + h.w * 0.62 + 40, hy + 60]], ease.quadOut),
  ];
}
const CLICKS = [T.click02, T.ctaPress[0]];
function pointerAt(t) {                         // desktop viewport coordinates, or null when no pointer is on the page
  if (t >= T.ptr[0] && t < T.ptr[1]) return { p: pathAt(MOVES1, t), op: 1 - tw(t, 11.3, 0.2, SITE.out) };
  if (t >= T.ptr2[0] && t < T.ptr2[1]) return { p: pathAt(MOVES2, t), op: tw(t, T.ptr2[0], 0.12, SITE.out) * (1 - tw(t, 23.42, 0.18, SITE.out)) };
  return null;
}

// The cursor light: light.ts — a critically damped spring per axis, response 0.9 s, resting when within 0.25 px.
// Integrated once at 240 Hz from the light's rest position and sampled; the target is the pointer, as on the site.
function simulateLight() {
  const hz = 240, n = Math.ceil(13 * hz) + 1, X = new Float64Array(n), Y = new Float64Array(n);
  const W = 2 * Math.PI / 0.9, rest = { x: 1920 * 0.72, y: 1080 * 0.3 };
  let x = rest.x, y = rest.y, vx = 0, vy = 0, tx = rest.x, ty = rest.y, live = false;
  for (let i = 0; i < n; i++) {
    const t = i / hz, P = pointerAt(t);
    if (P && P.p[0] >= 0 && P.p[0] <= 1920 && P.p[1] >= 0 && P.p[1] <= 1080) { if (P.p[0] !== tx || P.p[1] !== ty) live = true; tx = P.p[0]; ty = P.p[1]; }
    if (live) {
      vx += (W * W * (tx - x) - 2 * W * vx) / hz; vy += (W * W * (ty - y) - 2 * W * vy) / hz;
      x += vx / hz; y += vy / hz;
      if (Math.abs(tx - x) < 0.25 && Math.abs(ty - y) < 0.25 && Math.abs(vx) < 0.25 && Math.abs(vy) < 0.25) { vx = vy = 0; live = false; }
    }
    X[i] = x; Y[i] = y;
  }
  LIGHT = t => { const i = clamp(Math.round(t * hz), 0, n - 1); return [Math.round(X[i] * 16) / 16, Math.round(Y[i] * 16) / 16]; };
}
// Hover intervals per nav link, from the pointer path (enter / leave times).
function findHovers() {
  HOVER = G.links.map(r => {
    const iv = []; let inside = false, t0 = 0;
    for (let t = T.ptr[0]; t < T.ptr[1]; t += 1 / 240) {
      const P = pointerAt(t), on = !!P && P.op > 0.5 && P.p[0] >= r.x && P.p[0] <= r.x + r.w && P.p[1] >= r.y && P.p[1] <= r.y + r.h;
      if (on && !inside) { inside = true; t0 = t; }
      if (!on && inside) { inside = false; iv.push([t0, t]); }
    }
    if (inside) iv.push([t0, T.ptr[1]]);
    return iv;
  });
}
// a CSS transition on a boolean: in over `dur`, out over `dur` from wherever it had got to
function transit(iv, t, dur, curve) {
  let v = 0;
  for (const [a, b] of iv) {
    if (t < a) break;
    const vin = tw(Math.min(t, b), a, dur, curve);
    v = t < b ? vin : vin * (1 - tw(t, b, dur, curve));
  }
  return v;
}

// ────────────────────────────────────────── the desktop camera ──────────────────────────────────────────
function buildCamera() {
  const ed = { x: 960, y: G.film[0].y - G.sEd + G.film[0].h / 2, zoom: 1.36, rot: 0 };
  const h = G.handle, cta = { x: h.x + 120, y: h.y - G.sEd - 14, zoom: 2.2 };
  const fm = { x: G.fmark.x + G.fmark.w / 2, y: G.fmark.y - G.sMax + G.fmark.h / 2, zoom: 704 / G.fmark.w };  // the closing frame = the opening frame
  const barMatch = G.mbar.w * G.P.s / G.bar.w;                     // the desktop bar, as wide as the phone's bar on screen
  const barY = G.P.y + (G.mbar.y + G.mbar.h / 2) * G.P.s;            // … and centred where the phone's bar will be
  KEYS = [
    { t: 0, x: 960, y: 540, zoom: 1.6 },
    { t: 2.95, x: 960, y: 540, zoom: 1.6 },
    { t: 4.05, x: 960, y: 540, zoom: 1.0, curve: SITE.inout },                         // rides the site's own hand-off curve
    { t: 4.7, x: 960, y: 540, zoom: 1.0 },
    { t: 7.55, x: 850, y: 600, zoom: 1.14, curve: ease.sineInOut },                    // trails the light toward the headline
    { t: 9.3, x: 850, y: 600, zoom: 1.14 },
    { t: 10.1, x: 960, y: 225, zoom: 2.4, curve: ease.expoInOut },                     // snaps to the nav, landing keyed first
    { t: 11.45, x: 960, y: 225, zoom: 2.4 },
    { t: 12.0, x: 960 - (G.P.x + (G.mbar.x + G.mbar.w / 2) * G.P.s - 960) / barMatch, y: G.bar.y + G.bar.h / 2 + (540 - barY) / barMatch, zoom: barMatch, curve: ease.cubicInOut },
    { t: 12.3, x: 960 - (G.P.x + (G.mbar.x + G.mbar.w / 2) * G.P.s - 960) / barMatch, y: G.bar.y + G.bar.h / 2 + (540 - barY) / barMatch, zoom: barMatch },
    { t: 18.9, ...ed, curve: () => 1 },                                                 // set while the desktop is off screen
    { t: T.glide[0], ...ed },
    { t: T.glide[1], ...cta, curve: ease.quintInOut },
    { t: T.down[0], ...cta },
    { t: T.down[1], ...fm, curve: ease.cubicInOut },
  ];
  G.ed = ed;
}
// the page is a 1920×1080 window: at zoom ≥ 1 the camera never shows past its edges
function camAt(t) {

  return c;
}
function scrollD(t) {
  if (t < 12.5) return 0;
  if (t < T.down[0]) return G.sEd;
  return Math.round(lerp(G.sEd, G.sMax, tw(t, T.down[0], T.down[1] - T.down[0], ease.cubicInOut)) * 4) / 4;
}
const scrollM = t => Math.round(G.sM * tw(t, T.mscroll[0], T.mscroll[1] - T.mscroll[0], ease.cubicInOut) * 4) / 4;

// ────────────────────────────────────────── the phone ──────────────────────────────────────────
function mobileAt(t) {
  const P = G.P, screen = { x: 0, y: 0, w: 390, h: 844, r: 44 };
  const bar = { x: G.mbar.x, y: G.mbar.y, w: G.mbar.w, h: G.mbar.h, r: 10 };
  const sM = scrollM(t), f = G.mfilm[0], panel = { x: f.x, y: f.y - sM, w: f.w, h: f.h, r: 8 };
  let x = P.x, y = P.y, s = P.s, clip = screen;
  if (t < T.unroll[0]) clip = bar;
  else if (t < T.unroll[1]) clip = OM.morphRect(t, T.unroll[0], T.unroll[1], bar, screen, { curve: ease.quintInOut });
  if (t >= T.push[0]) {
    // the panel's rect on screen travels from where it sits in the phone to the frame, then to its desktop slot
    const A = { x: P.x + panel.x * P.s, y: P.y + panel.y * P.s, w: panel.w * P.s, h: panel.h * P.s };
    let R = OM.morphRect(t, T.push[0], T.push[1], A, G.L, { curve: ease.expoInOut });
    if (t >= T.back[0]) R = OM.morphRect(t, T.back[0], T.back[1], G.L, G.D1, { curve: ease.quintInOut });
    s = R.w / panel.w; x = R.x - panel.x * s; y = R.y - panel.y * s;
    clip = OM.morphRect(t, T.push[0], T.push[1], screen, panel, { curve: ease.expoInOut });
  }
  return { x, y, s, clip, vis: t >= T.swap[0] && t < T.back[1], op: tw(t, T.swap[0], T.swap[1] - T.swap[0], SITE.out) };
}

// ────────────────────────────────────────── the films ──────────────────────────────────────────
const pad = n => String(n).padStart(4, '0');
const F01 = src => `frames/film01/${pad(clamp(Math.round(src * 30), 27, 186))}.jpg`;

  at(T.tapMenu, 'tap', G.P.x + ctr(G.toggle).x * G.P.s, 0.8);
  at(T.menuOpen, 'menu-open', G.P.x + ctr(G.toggle).x * G.P.s, 0.6);
  at(T.tapAtm, 'tap', G.P.x + ctr(G.mlinks[0]).x * G.P.s, 0.7);
  at(T.mscroll[0], 'scroll', 960, 0.6);
  at(T.push[0], 'push', 960, 1);
  at(T.back[0], 'back', 1100, 0.7);
  at(T.click02, 'click', 1500, 0.8);
  at(T.glide[0], 'glide', 600, 0.6);
  at(T.ctaPress[0], 'click', 420, 0.6);
  at(T.down[0], 'descend', 960, 0.7);
  at(T.glow, 'bookend', 960, 1);
  at(T.recede, 'recede', 960, 0.8);
  at(T.powered, 'powered', 960, 0.4);
  at(T.logo, 'signature', 960, 1);
  at(T.sweep[0], 'sweep', 700, 0.5);
  // the light's speed (px/s on screen), for the air that follows it
  const curve = []; for (let t = 0; t <= DUR; t += 1 / 60) { const a = LIGHT(Math.max(0, t - 1 / 60)), b = LIGHT(t); curve.push(+(Math.hypot(b[0] - a[0], b[1] - a[1]) * 60).toFixed(1)); }
  return { T: DUR, events: e.sort((p, q) => p.t - q.t), light: { hz: 60, speed: curve } };
};

window.__ready = (async () => {
  await document.fonts.ready;
  await Promise.all([document.fonts.load("300 64px 'Jost'"), document.fonts.load("460 17px 'Jost'")]);
  HAS_LOGO = await logoReady;
  await Promise.all([...D.root.querySelectorAll('img'), ...M.root.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
  measure(); buildHands(); buildCamera(); simulateLight(); findHovers();
  // the desktop panel's rect on screen at the editorial framing: where the phone's film lands
  const Me = OM.view(G.ed), r = G.film[0];
  G.D1 = OM.projectBox(Me, { x: r.x, y: r.y - G.sEd, w: r.w, h: r.h });
  layoutEnd(); dither(); drawLogo(-1);
  await seek(0);
  return true;
})();
if (Q.has('hud')) $('hud').style.display = 'block';
if (Q.has('t')) __ready.then(() => seek(parseFloat(Q.get('t'))));
if (Q.has('play')) __ready.then(() => { const t0 = performance.now(); (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); });
</script>
