  box-shadow:0 0 34px rgb(255 240 220 / .10), inset 0 0 22px rgb(255 240 220 / .06)}

<body>

<script>
// ══════════════════════════════════════════════════════════════════════════════════════════════
// RIFLESSO, vertical — a single reflection travels through GLASS; the name is the architecture it moves through.
// 9:16, the mobile site only: the site's own markup and CSS, mounted at a 390 × 693 phone viewport (its real
// breakpoints) and filling the 1080 × 1920 frame. The frame is the phone; every cause is a touch.
// Motion direction: Hybrid Luxury Cinematic × Apple Motion. Interface states keep the site's UI timing (≤ 300 ms,
// ease-out); the light, the camera, the portal, the aperture and the signature take longer. Everything is f(t).
//
// THE GLASS LIGHT: 01 it reveals the name → it rests as the hero's light (static on touch, as on the site), refracted in
// the satin backdrop and caught by the bar's top edge → 04 it sweeps the film frame open → it returns behind the name
// → 07 one last reflection reveals BRETÌA.
//
//  t (s)          beat                                                  carries into the next beat
//  0.00–0.50      black
//  0.50–2.95      01 DIAMOND LIGHT REVEAL (the site's intro + the light)  the name (1.25×)
//  2.95–3.30      hold on the lit name
//  3.30–4.40      the hand-off: the name becomes the hero's architecture   the name grows; camera 1.25 → 1
//  3.85–4.60      03 the bar emerges · 06 the headline, word by word
//  4.60–8.45      the hero, still: the light, the refraction, the headline  the bar
//  8.45–9.63      03 MENU: the panel morphs out of the toggle; a tap on Atmosfera   the tap
//  9.65–10.45     the real anchor scroll; 06 the heading rises             the film panel
// 10.50–12.30     film 01 autoplays · 04 THE PORTAL: the camera pushes until the 9:16 panel is the frame
// 12.30–15.00     film 01, full frame
// 15.00–16.10     the camera pulls back · 05 the page reopens through a crystal aperture   the panel
// 16.40–17.30     a swipe: 01 pauses as it leaves, 02 autoplays as it arrives (films.ts)   the swipe
// 17.30–19.30     film 02
// 19.35–20.95     a swipe to Instagram; a tap on @glass_rende             the tap
// 20.95–22.55     the page ends on its own mark                           the mark
// 22.55–24.80     GLASS, the light behind it
// 24.80–25.60     recede                                                  (the end card: the one declared cut)
// 25.65–30.00     POWERED BY · 07 the reflection reveals BRETÌA · hold
// ══════════════════════════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const { clamp, lerp, seg, ease } = OM;
const FPS = 30, DUR = 30.0, FW = 1080, FH = 1920, VW = 390, VH = 693.333, S0 = FW / VW;
const Q = new URLSearchParams(location.search);
// the site's own curves (src/styles/global.css, src/scripts/intro.ts) and the CSS keyword `ease`
const SITE = { out: OM.bezier(0.23, 1, 0.32, 1), quart: OM.bezier(0.25, 1, 0.5, 1), inout: OM.bezier(0.77, 0, 0.175, 1), ease: OM.bezier(0.25, 0.1, 0.25, 1) };

const bell = u => (u <= 0 || u >= 1 ? 0 : Math.sin(Math.PI * u));

// ────────────────────────────────────────── timeline ──────────────────────────────────────────
const T = {
  intro: 0.5, introHold: [2.95, 3.3], sweep: [1.2, 2.3], navIn: 3.85, words: 3.95,
  tapMenu: 8.45, menuOpen: 8.53, tapAtm: 9.55, menuClose: 9.63, anchor: [9.65, 10.45], heading: 10.3,
  play01: 10.5, push: [11.0, 12.3], sheen: [11.65, 12.45], pull: [15.0, 16.0], iris: [15.2, 16.1],
  swipe1: [16.4, 17.5], swipe2: [19.35, 20.05], tapCta: [20.4, 20.49], down: [20.95, 22.55], fade: [21.65, 22.4],
  glow: 22.55, recede: 24.8, powered: 25.65, reveal: [26.0, 26.95],

window.__meta = { dur: DUR, fps: FPS, w: FW, h: FH,
  // 3.85: the site's hand-off lands the name at 7.5 % opacity, under probe.py's 0.15 floor (carried, but invisible to it);
  // 25.3: the end card, the one cut the film means
  // 26.2: inside the end card, BRETÌA appears under POWERED BY, which stays put by design
  cuts: [3.85, 25.3, 26.2],
  inFrame: { menu: [8.85, 9.5, 'whole'], film01: [12.4, 14.9, 'whole'], film02: [17.4, 19.2, 'whole'], fmark: [22.6, 24.8, 'whole'], bretia: [27.2, 30, 'whole'] } };

// ────────────────────────────────────────── the site, mounted ──────────────────────────────────────────
// Film-only layers live inside the site's own boxes so they move with it: the refraction streaks in the hero backdrop
// (under the type and the grain), the light on the bar's top edge, a sheen in each film frame, word masks on the
// headlines. The site's markup and CSS are otherwise untouched.
const FILM_CSS = `
.film-refr{position:absolute;inset:0;overflow:hidden;mix-blend-mode:screen;pointer-events:none}
.film-refr i{position:absolute;top:-30%;height:160%;left:0;transform-origin:50% 50%}
.film-edge{position:absolute;left:8px;right:8px;top:0;height:1px;pointer-events:none;opacity:0}
.film-edge-glow{position:absolute;left:0;right:0;top:0;height:16px;pointer-events:none;opacity:0;border-radius:inherit}
.film-sheen{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:linear-gradient(105deg,transparent 38%,rgb(255 248 236 / .22) 50%,transparent 62%) 0 0/260% 100% no-repeat}
.fw{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .03em .16em;margin:-.04em -.03em -.16em}
.fwi{display:inline-block;will-change:transform}
`;
function mount(id, spec) {
  const host = $(id), root = host.attachShadow({ mode: 'open' });
  root.innerHTML = `<style>${spec.css}${FILM_CSS}</style><div class="site-body">${spec.html}</div>`;
  const body = root.querySelector('.site-body');
  Object.assign(body.style, { height: '100%', overflowY: 'auto', overflowX: 'hidden', scrollbarWidth: 'none' });
  root.querySelectorAll('[data-film-control]').forEach(c => c.removeAttribute('hidden'));
  root.querySelectorAll('.film__frame').forEach(f => f.insertAdjacentHTML('beforeend', '<i class="film-sheen"></i>'));
  return { host, root, body, q: s => root.querySelector(s), qa: s => [...root.querySelectorAll(s)] };
}
// words of a heading, each behind its own mask (06 · kinetic typography); the text and its style stay the site's
function maskWords(el) {
  const words = [];
  const walk = node => {
    for (const ch of [...node.childNodes]) {
      if (ch.nodeType === 3) {
        const frag = document.createDocumentFragment();
        ch.textContent.split(/(\s+)/).forEach(part => {
          if (!part) return;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
          const w = document.createElement('span'); w.className = 'fw'; const i = document.createElement('span'); i.className = 'fwi'; i.textContent = part;

const M = mount('phone', GLASS_SITE.phone);
M.q('.hero__backdrop [data-light]').insertAdjacentHTML('afterend', '<div class="film-refr"><i></i><i></i><i></i></div>');
M.q('.nav__bar').style.position = 'relative';
M.q('.nav__bar').insertAdjacentHTML('afterbegin', '<i class="film-edge-glow"></i><i class="film-edge"></i>');
const film = root => ({ root, frame: root.querySelector('.film__frame'), img: root.querySelector('[data-film-poster]'), ctrl: root.querySelector('[data-film-control]'),
  sheen: root.querySelector('.film-sheen'),
  icons: { play: root.querySelector('.film__icon--play'), pause: root.querySelector('.film__icon--pause'), replay: root.querySelector('.film__icon--replay') }, cur: '' });
const E = {
  veil: M.q('[data-intro-veil]'), iglow: M.q('[data-intro-glow]'), imark: M.q('[data-intro-mark]'), letters: M.qa('[data-intro-mark] .wordmark__letter'),
  heroMark: M.q('[data-hero-mark]'), reveals: M.qa('[data-intro-reveal]').sort((a, b) => a.dataset.introReveal - b.dataset.introReveal),
  light: M.q('[data-light]'), refr: M.qa('.film-refr i'), nav: M.q('header.nav'), bar: M.q('.nav__bar'), edge: M.q('.film-edge'), edgeGlow: M.q('.film-edge-glow'),
  barParts: [M.q('.nav__brand'), M.q('[data-menu-toggle]')], toggle: M.q('[data-menu-toggle]'), menu: M.q('[data-menu]'), scrim: M.q('[data-menu-scrim]'),
  mlinks: M.qa('[data-menu-link]'), mfoot: M.q('.menu__foot'), lines: M.qa('.nav__toggle-icon i'),
  title: M.q('.hero__title'), main: M.q('main'), footer: M.q('footer'), fmark: M.q('.footer__mark'), fgrid: M.q('.footer__grid'), flegal: M.q('.footer__legal'),
  films: M.qa('[data-film]').map(film), cta: M.q('.cta'), handle: M.q('.cta__handle'), xpTitle: M.q('.xp__title'),

E.titleWords = maskWords(E.title);
E.xpWords = maskWords(E.xpTitle);
// 01 · the light inside each letter of the intro's name: a second copy of the glyph, filled with a moving band
E.sweep = E.letters.map((svg, i) => {
  const NS = 'http://www.w3.org/2000/svg', use0 = svg.querySelector('use');
  const defs = document.createElementNS(NS, 'defs'), g = document.createElementNS(NS, 'linearGradient');
  g.setAttribute('id', `film-sweep-${i}`); g.setAttribute('y1', '0'); g.setAttribute('y2', '0.18');
  [[0, 0], [0.5, 0.95], [1, 0]].forEach(([o, a]) => { const s = document.createElementNS(NS, 'stop'); s.setAttribute('offset', o); s.setAttribute('stop-color', '#fffaf1'); s.setAttribute('stop-opacity', a); g.appendChild(s); });
  defs.appendChild(g); svg.insertBefore(defs, use0);
  const use = document.createElementNS(NS, 'use'); use.setAttribute('href', use0.getAttribute('href')); use.setAttribute('fill', `url(#film-sweep-${i})`); svg.appendChild(use);
  return { g, x: parseFloat(svg.style.left) / 100, w: parseFloat(svg.style.width) / 100 };
});

// ────────────────────────────────────────── measured in __ready ──────────────────────────────────────────
let G = {}, KEYS = [], SCROLL = [];
const rectIn = el => { const r = el.getBoundingClientRect(), h = M.host.getBoundingClientRect(); return { x: r.left - h.left, y: r.top - h.top, w: r.width, h: r.height }; };
const ctr = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });

function measure() {
  M.host.setAttribute('data-intro', 'play');
  E.imark.style.transform = 'none';
  const im = rectIn(E.imark), hm = rectIn(E.heroMark);
  G.handoff = { dx: hm.x + hm.w / 2 - (im.x + im.w / 2), dy: hm.y + hm.h / 2 - (im.y + im.h / 2), s: hm.w / im.w };
  G.imark = im;
  M.host.removeAttribute('data-intro');
  G.bar = rectIn(E.bar); G.toggle = rectIn(E.toggle);
  E.mlinks.forEach(l => { l.style.transform = 'none'; }); E.menu.style.transform = 'none';
  G.mlinks = E.mlinks.map(rectIn); G.menu = rectIn(E.menu);
  E.mlinks.forEach(l => { l.style.transform = ''; }); E.menu.style.transform = '';
  G.film = E.films.map(f => rectIn(f.frame));                    // page coordinates (scroll 0)
  G.handle = rectIn(E.handle); G.fmark = rectIn(E.fmark);
  G.pageH = M.body.scrollHeight; G.sMax = G.pageH - VH;
  G.sAtm = Math.round(M.q('#atmosfera').offsetTop - 78);         // anchor scroll lands under scroll-padding-top (10 + 52 + 16)
  const centre = r => Math.round(clamp(r.y + r.h / 2 - VH / 2, 0, G.sMax));
  G.sP = centre(G.film[0]); G.s02 = centre(G.film[1]); G.sCta = Math.round(clamp(G.handle.y - 0.42 * VH, 0, G.sMax));
  G.light = { x: 0.72 * VW, y: 0.3 * VH };                       // touch: the light rests, static (light.ts is fine-pointer only)
}

// ────────────────────────────────────────── scroll and camera ──────────────────────────────────────────
// The page scrolls for real (sticky and fixed elements behave as on a phone); the camera frames it in world
// coordinates (the 1080 × 1920 frame at zoom 1), keyed flat in the holds.
function buildScroll() {
  SCROLL = [
    [T.anchor[0], T.anchor[1], 0, G.sAtm, ease.cubicInOut],       // the anchor link's smooth scroll
    [T.push[0], T.push[1], G.sAtm, G.sP, ease.cubicInOut],        // brought fully into view as the camera approaches
    [T.swipe1[0], T.swipe1[1], G.sP, G.s02, ease.cubicOut],       // a swipe: a fling that settles, calmly
    [T.swipe2[0], T.swipe2[1], G.s02, G.sCta, ease.cubicOut],
    [T.down[0], T.down[1], G.sCta, G.sMax, ease.cubicInOut],
  ];
}
function scrollAt(t) {
  let s = 0;
  for (const [a, b, s0, s1, c] of SCROLL) { if (t < a) break; s = lerp(s0, s1, c(seg(t, a, b))); }
  return Math.round(s * 8) / 8;
}
function buildCamera() {
  const f = G.film[0], panelW = f.w * S0, Zp = FW / panelW;                                // the 9:16 panel fills the 9:16 frame
  const pc = { x: (f.x + f.w / 2) * S0, y: (f.y - G.sP + f.h / 2) * S0 };
  const fm = G.fmark, Zf = G.imark.w * 1.25 / fm.w;                                        // the closing name = the opening name
  const fc = { x: (fm.x + fm.w / 2) * S0, y: (fm.y - G.sMax + fm.h / 2) * S0 };
  const ic = { x: (G.imark.x + G.imark.w / 2) * S0, y: (G.imark.y + G.imark.h / 2) * S0 };
  const h1 = T.introHold[1];
  KEYS = [
    { t: 0, ...ic, zoom: 1.25 },
    { t: h1, ...ic, zoom: 1.25 },
    { t: h1 + 1.1, x: 540, y: 960, zoom: 1.0, curve: SITE.inout },                       // rides the site's own hand-off curve
    { t: T.push[0], x: 540, y: 960, zoom: 1.0 },
    { t: T.push[1], ...pc, zoom: Zp, curve: ease.cubicInOut },                            // 04 · the portal
    { t: T.pull[0], ...pc, zoom: Zp },
    { t: T.pull[1], x: 540, y: 960, zoom: 1.0, curve: ease.cubicInOut },
    { t: T.down[0], x: 540, y: 960, zoom: 1.0 },
    { t: T.down[1], ...fc, zoom: Zf, curve: ease.cubicInOut },

}
function camAt(t) {

  return c;
}
const hostMatrix = cam => { const m = OM.view(cam, { W: FW, H: FH }); return [m[0] * S0, m[1] * S0, m[2] * S0, m[3] * S0, m[4], m[5]]; };
const toScreen = (M_, x, y) => [M_[0] * x + M_[2] * y + M_[4], M_[1] * x + M_[3] * y + M_[5]];       // host-local → screen
// the visible share of a film panel at a scroll position (films.ts: 60 % starts it, under 20 % pauses it)
const share = (f, s) => clamp((Math.min(f.y + f.h, s + VH) - Math.max(f.y, s)) / f.h, 0, 1);
function filmTimes() {
  let pause01 = null, play02 = null;
  for (let t = T.swipe1[0]; t <= T.swipe1[1] + 1; t += 1 / 240) {
    const s = scrollAt(t);
    if (pause01 === null && share(G.film[0], s) < 0.2) pause01 = t;
    if (pause01 !== null && play02 === null && share(G.film[1], s) >= 0.6) { play02 = t; break; }
  }

}

// ────────────────────────────────────────── the films ──────────────────────────────────────────
const pad = n => String(n).padStart(4, '0');
const F01 = src => `frames/film01/${pad(clamp(Math.round(src * 30), 27, 186))}.jpg`;
const F02 = src => `frames/film02/${pad(clamp(Math.floor(src * 25 + 1e-6), 0, 48))}.jpg`;
const STILL02 = F02(1.0);                     // panel 02 waits on a frame of its first 7 s, not on the site's 7.2 s poster
const src01 = t => 1.0 + (Math.min(t, G.pause01) - T.play01);   // film 01 from 1.0 s (past the opening flash), paused as it leaves
const src02 = t => Math.min(t - G.play02, 1.92);                 // film 02 from its start, stopping before the colour flash at 1.96 s
function setImg(f, src, pending) { if (f.cur !== src) { f.cur = src; f.img.src = src; pending.push(f.img.decode().catch(() => {})); } f.img.style.opacity = 1; }

function filmUI(f, states, t) {

  f.root.dataset.state = cur;
  const want = s => ({ play: s === 'idle' || s === 'paused', pause: s === 'playing', replay: s === 'ended' });

  }

// ────────────────────────────────────────── colours ──────────────────────────────────────────
const SILVER = [197, 198, 201], WHITE = [242, 240, 237], DIM = [150, 151, 156];
const mix = (a, b, k) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(' ')})`;

// ────────────────────────────────────────── the end card ──────────────────────────────────────────
const LOGO = new Image();
LOGO.src = Q.get('logo') === 'mono' ? '../assets/bretia-logo-mono.png' : '../assets/bretia-logo.png';
const logoReady = new Promise(res => { LOGO.onload = () => res(true); LOGO.onerror = () => res(false); });
let HAS_LOGO = false, LOGO_BOX = null, logoDrawn = null;
function layoutEnd() {

  const group = 24 + 64 + h, top = Math.round(FH / 2 - group / 2 + 10);
  $('powered').style.top = top + 'px';
  LOGO_BOX = { x: FW / 2 - w / 2, y: top + 24 + 64, w, h };
  const cv = $('logo'), ph = $('placeholder');
  if (HAS_LOGO) {
    cv.width = Math.round(w * 2); cv.height = Math.round(h * 2);                   // drawn at the 4K render's density
    Object.assign(cv.style, { left: LOGO_BOX.x + 'px', top: LOGO_BOX.y + 'px', width: w + 'px', height: h + 'px' });

  const beats = { ...T, pause01: G.pause01, play02: G.play02 };
  return { T: DUR, beats, events: e.sort((p, q) => p.t - q.t), light: { hz: 60, speed: Array(Math.ceil(DUR * 60) + 1).fill(0) } };
};

window.__ready = (async () => {
  await document.fonts.ready;
  await Promise.all([document.fonts.load("300 30px 'Jost'"), document.fonts.load("460 17px 'Jost'")]);
  HAS_LOGO = await logoReady;
  await Promise.all([...M.root.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
  measure(); buildScroll(); buildCamera(); filmTimes();
  layoutEnd(); dither();
  await seek(0);
  return true;
})();
if (Q.has('hud')) $('hud').style.display = 'block';
if (Q.has('t')) __ready.then(() => seek(parseFloat(Q.get('t'))));
if (Q.has('play')) __ready.then(() => { const t0 = performance.now(); (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); });
</script>
